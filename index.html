<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jump &amp; Run">
<meta name="theme-color" content="#11141c">
<title>Mein Jump & Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
  /* Layout: game screen (800x600 world, same as jump_and_run.py) in a rounded frame, touch controls below. Single committed dark frame around a colorful game. */
  :root {
    --bg: #10131c;
    --frame: #1a1f2c;
    --line: #2c3446;
    --fg: #eef2f8;
    --muted: #8d98ad;
    --accent: #ff7a3d;
    --teal: #2ec4b6;
    --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    -webkit-user-select: none; user-select: none;
  }
  .stage, .pad, .help { width: 100%; max-width: 800px; }
  .stage { aspect-ratio: 4 / 3; max-height: 80vh; border-radius: 14px; overflow: hidden; border: 3px solid var(--line); background: #6ec6ff; touch-action: none; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .help { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  kbd { font-family: var(--ui); font-size: .74rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--fg); background: var(--frame); }
  .pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pad .grp { display: flex; gap: 10px; }
  .pad button {
    font: inherit; font-weight: 800; color: var(--fg); background: var(--frame); border: 2px solid var(--line);
    border-radius: 16px; height: 64px; min-width: 68px; padding: 0 12px; cursor: pointer; touch-action: none; font-size: 1.25rem;
  }
  .pad #jump { background: var(--accent); border-color: var(--accent); color: #1b0d05; min-width: 96px; font-size: .95rem; }
  .pad #shoot { color: var(--teal); min-width: 70px; font-size: .9rem; }
  .pad .small { min-width: 48px; font-size: .9rem; color: var(--muted); }
  .pad button.on { transform: scale(.95); filter: brightness(1.2); }
  .pad button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>

</head>
<body>
<div class="stage" id="stage"><canvas id="game" width="800" height="600" aria-label="Jump and Run Spielfeld"></canvas></div>

<div class="pad" aria-label="Steuerung">
  <div class="grp">
    <button id="bl" type="button" aria-label="Links">◀</button>
    <button id="br" type="button" aria-label="Rechts">▶</button>
  </div>
  <div class="grp">
    <button id="snd" class="small" type="button" aria-label="Sound an oder aus">♪</button>
    <button id="pau" class="small" type="button" aria-label="Pause">II</button>
  </div>
  <div class="grp">
    <button id="shoot" type="button">⚔ SCHLAG</button>
    <button id="jump" type="button">SPRUNG</button>
  </div>
</div>

<div class="help">
  <span><kbd>←</kbd> <kbd>→</kbd> laufen</span>
  <span><kbd>Leertaste</kbd> springen (halten = höher)</span>
  <span><kbd>X</kbd> angreifen</span>
  <span><kbd>P</kbd> Pause</span>
  <span><kbd>M</kbd> Sound</span>
</div>

    else { p.vx *= slip ? 0.965 : p.onGround ? FRICTION : 0.94; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
    // Springen (mit Coyote-Time und Sprung-Puffer)
    if (jumpPressed) { p.buffer = BUFFER; jumpPressed = false; }
    if (p.buffer > 0) p.buffer--;
    if (p.onGround) { p.coyote = COYOTE; p.jumps = 0; p.combo = 0; } else if (p.coyote > 0) p.coyote--;
    if (p.buffer > 0) {
      if (p.coyote > 0) { p.vy = JUMP; p.coyote = 0; p.buffer = 0; p.jumps = 1; p.sx = 0.75; p.sy = 1.3; SFX.jump(); dust(p.x + p.w / 2, p.y + p.h, 6); }
      else if (p.pw.F > 0 && p.jumps < 2) { p.vy = JUMP2; p.buffer = 0; p.jumps = 2; p.sx = 0.8; p.sy = 1.25; SFX.jump2(); ring(p.x + p.w / 2, p.y + p.h, '#ffffff'); }
    }
    if (!keys.jump && p.vy < -5) p.vy *= 0.6;      // kurz drücken = kleiner Sprung
    // Angreifen (X): Schlag mit der aktuellen Waffe
    const wpn = WEAPONS[run.weapon];
    if (p.atkCd > 0) p.atkCd--;
    if (p.atk > 0) p.atk--;
    if ((shootPressed || (keys.shoot && wpn.ranged)) && p.atkCd <= 0) startAttack();
    shootPressed = false;
    if (!wpn.ranged && p.atk === wpn.swing - 3) meleeHit();   // Treffer kurz nach Schlagbeginn
    if (wpn.fire && frame % 4 === 0) L.particles.push({ x: p.x + p.w / 2 + p.facing * 22, y: p.y + rand(-6, 6), vx: rand(-0.4, 0.4), vy: rand(-1.4, -0.4), life: 16, max: 16, size: rand(2, 3.5), color: '#ffb238', g: 0 });
    // Physik
    p.vy = Math.min(p.vy + GRAV, MAX_FALL);
    p.prevBottom = p.y + p.h;
    const wasGround = p.onGround, fallSpeed = p.vy;
    moveX(p); moveY(p, true);
    if (!wasGround && p.onGround) { if (fallSpeed > 6) { p.sx = 1.3; p.sy = 0.72; dust(p.x + p.w / 2, p.y + p.h, 8); SFX.land(); } }
    if (p.onGround && Math.abs(p.vx) > 3 && frame % 7 === 0) dust(p.x + p.w / 2, p.y + p.h, 1);
    // Optik
    p.sx += (1 - p.sx) * 0.2; p.sy += (1 - p.sy) * 0.2;
    p.walk += p.onGround ? Math.abs(p.vx) * 0.09 : 0;
    if (p.inv > 0) p.inv--;
    for (const k in p.pw) if (p.pw[k] > 0) p.pw[k]--;
    if (p.pw.R > 0 && frame % 3 === 0) p.trail.push({ x: p.x, y: p.y, life: 12, facing: p.facing });
    for (const t of p.trail) t.life--; p.trail = p.trail.filter((t) => t.life > 0);
  }

  function startAttack() {
    const p = P, w = WEAPONS[run.weapon];
    p.atk = w.swing; p.atkCd = w.cd;
    const sx = p.x + p.w / 2 + p.facing * 14;
    if (w.bolt) { L.shots.push({ kind: 'bolt', x: sx, y: p.y + 18, vx: p.facing * 14, vy: 0, life: 50, dmg: 2 }); SFX.bow(); }
    else if (w.magic) { L.shots.push({ kind: 'magic', x: sx, y: p.y + 10, vx: p.facing * 7, vy: 0, life: 90, dmg: 2 }); SFX.shoot2(); }
    else if (w.ranged) { L.shots.push({ kind: 'arrow', x: sx, y: p.y + 18, vx: p.facing * 10, vy: 0, life: 60, dmg: 1 }); SFX.bow(); }
    else SFX.swing();
    if (w.fire) { L.shots.push({ kind: 'flame', x: p.x + p.w / 2 + p.facing * 20, y: p.y + 20, vx: p.facing * 7, vy: 0, life: 30, dmg: 1 }); SFX.fire(); }
  }
  function meleeHit() {
    const p = P, w = WEAPONS[run.weapon];
    const hb = w.thrust ? { x: p.facing > 0 ? p.x + p.w - 6 : p.x - w.range + 6, y: p.y + 2, w: w.range, h: 22 }   // Speer: lang, aber schmal
                        : { x: p.facing > 0 ? p.x + p.w - 6 : p.x - w.range + 6, y: p.y - 14, w: w.range, h: p.h + 20 };
    let hit = false;
    for (const e of L.enemies) if (!e.dead && overlap(hb, e)) hit = damageEnemy(e, w.dmg, p.facing, 'hit', { freeze: w.ice, heavy: w.heavy }) || hit;
    const B = L.boss;
    if (B && B.active && !B.dead && !(B.alpha < 0.6) && overlap(hb, B)) { bossHit(w.dmg); hit = true; }
    for (const s of L.bossShots) if (s.life > 0 && !STAY[s.kind] && overlap(hb, { x: s.x - s.r, y: s.y - s.r, w: s.r * 2, h: s.r * 2 })) { s.life = 0; burst(s.x, s.y, '#ffffff', 8); SFX.clang(); hit = true; }
    if (hit && w.heavy) { shake = 9; SFX.thud(); dust(hb.x + hb.w / 2, p.y + p.h, 10); }
    if (hit) { shake = Math.max(shake, 3); sparkle(hb.x + (p.facing > 0 ? hb.w - 10 : 10), p.y + 10, w.fire ? '#ffb238' : '#ffffff'); }
  }

  // Kollision mit Kacheln: erst waagerecht, dann senkrecht
  function moveX(e) {
    e.x += e.vx; e.hitWall = false;
    const r0 = Math.floor(e.y / T), r1 = Math.floor((e.y + e.h - 0.01) / T);
    const c = e.vx > 0 ? Math.floor((e.x + e.w - 0.01) / T) : Math.floor(e.x / T);
    for (let r = r0; r <= r1; r++) {
      if (solid(tileAt(c, r))) {
        if (e.vx > 0) e.x = c * T - e.w; else if (e.vx < 0) e.x = (c + 1) * T;
        e.vx = e.isPlayer ? 0 : e.vx; e.hitWall = true; break;
      }
    }
  }
  function moveY(e, withPlatforms) {
    const prevBottom = e.y + e.h;
    e.y += e.vy; e.onGround = false; if (e === P) e.ride = null;
    const c0 = Math.floor(e.x / T), c1 = Math.floor((e.x + e.w - 0.01) / T);
    if (e.vy > 0) {
      const r = Math.floor((e.y + e.h - 0.01) / T);
      for (let c = c0; c <= c1; c++) {
        const ch = tileAt(c, r);
        if (solid(ch) || (ch === '-' && prevBottom <= r * T + 0.5)) { e.y = r * T - e.h; e.vy = 0; e.onGround = true; break; }
      }
    } else if (e.vy < 0) {
      const r = Math.floor(e.y / T);
      for (let c = c0; c <= c1; c++) if (solid(tileAt(c, r))) { e.y = (r + 1) * T; e.vy = 0; break; }
    }
    if (withPlatforms && e.vy >= 0) {
      for (const pl of L.plats) {
        if (pl.gone > 0) continue;
        if (e.x + e.w > pl.x + 2 && e.x < pl.x + pl.w - 2 && prevBottom <= pl.y + 2 + Math.max(0, -pl.dy) + Math.max(0, pl.dy) && e.y + e.h >= pl.y) {
          e.y = pl.y - e.h; e.vy = 0; e.onGround = true; if (e === P) e.ride = pl; break;
        }
      }
    }
  }

  function hurt(knock = true) {
    const p = P;
    if (p.inv > 0 || p.pw.U > 0 || p.dead) return;
    p.hearts--; p.inv = 100; shake = 10; SFX.hurt();
    if (knock) { p.vy = -8; p.vx = -p.facing * 5; }
    burst(p.x + p.w / 2, p.y + p.h / 2, '#ff4d6d', 14);
    if (p.hearts <= 0) die();
  }
  function fallDeath(lava) {
    const p = P; if (p.dead) return;
    if (lava) { SFX.lava(); burst(p.x + p.w / 2, p.y + p.h / 2, '#ff7b2b', 24); } else SFX.hurt();
    p.hearts--; shake = 12;
    if (p.hearts <= 0) { die(); return; }
    p.x = L.spawn.x; p.y = L.spawn.y; p.vx = 0; p.vy = 0; p.inv = 100; p.ride = null;
    cam = clamp(p.x - W * 0.4, 0, L.w - W);
  }
  function die() { P.dead = true; P.vy = -12; P.vx = 0; scene = 'dying'; sceneT = 0; music.on = false; SFX.over(); }

  // =====================================================================
  //  GEGNER
  // =====================================================================
  // Goblin: klein, 1 Treffer | Ork: Stachelhelm (nicht draufspringen!), 2 Treffer | Troll: groß, springt, 3 Treffer | Fledermaus: fliegt
  function makeEnemy(type, x, y) {
    const S = { goblin: [26, 32, 1.2, 1], ork: [30, 38, 1.4, 2], bat: [34, 22, 0, 1], troll: [38, 46, 0, 3], skelett: [28, 40, 1.0, 2] }[type];
    const hp = S[3] + (diffK >= 1.25 && (type === 'ork' || type === 'troll' || type === 'skelett') ? 1 : 0) + (diffK >= 1.5 && type === 'goblin' ? 1 : 0);
    return { type, x: x + (T - S[0]) / 2, y: y + T - S[1], w: S[0], h: S[1], vx: -S[2] * diffK, vy: 0, x0: x + 20, y0: y + 20, t: rand(0, 100),
             onGround: false, dead: 0, timer: irand(40, 90), facing: -1, hp, maxHp: hp, hitT: 0, kb: 0, frozen: 0, throwT: irand(60, 140) };
  }
  function damageEnemy(e, dmg, dir, how, o = {}) {
    if (e.dead || e.hitT > 0) return false;
    e.hp -= dmg; e.hitT = 14;
    if (e.hp <= 0) { killEnemy(e, how); return true; }
    SFX.hit(); burst(e.x + e.w / 2, e.y + e.h / 2, o.freeze ? '#9fe8ff' : '#ffffff', 6);
    if (o.freeze) e.frozen = 120;   // Eisschwert friert ein
    if (e.type === 'bat') e.x0 += dir * 30; else e.kb = dir * (o.heavy ? 10 : 5);   // zurückstoßen
    return true;
  }
  function updateEnemies() {
    for (const e of L.enemies) {
      if (e.dead) { e.dead++; continue; }
      e.t++;
      if (e.hitT > 0) e.hitT--;
      if (e.kb) { const v = e.vx; e.vx = e.kb; moveX(e); e.vx = v; e.kb *= 0.7; if (Math.abs(e.kb) < 0.3) e.kb = 0; }
      if (e.frozen > 0) { e.frozen--; if (e.type !== 'bat') { e.vy = Math.min(e.vy + GRAV, MAX_FALL); moveY(e, false); } continue; }   // eingefroren
      if (e.type === 'skelett' && --e.throwT <= 0 && Math.abs(P.x - e.x) < 320 && Math.abs(P.y - e.y) < 220) {   // wirft Knochen
        e.throwT = irand(110, 170) / diffK; e.facing = P.x < e.x ? -1 : 1; e.vx = Math.abs(e.vx) * e.facing;
        L.bossShots.push({ kind: 'bone', x: e.x + e.w / 2, y: e.y + 8, vx: e.facing * 3.2, vy: -7, g: 0.35, r: 8, life: 200 }); SFX.throw();
      }
      if (e.type === 'bat') {
        const nx = e.x0 + Math.sin(e.t * 0.015 * diffK) * 90 - e.w / 2;
        e.facing = nx > e.x ? 1 : -1; e.x = nx; e.y = e.y0 + Math.sin(e.t * 0.07) * 18 - e.h / 2;
        continue;
      }
      if (e.type === 'troll') {   // stampft in Sprüngen auf den Ritter zu
        e.vy = Math.min(e.vy + GRAV, MAX_FALL);
        const wasGround = e.onGround;
        if (e.onGround) { e.vx = 0; if (--e.timer <= 0) { e.vy = -9.5; e.vx = Math.sign(P.x - e.x || 1) * 2; e.facing = Math.sign(e.vx); e.timer = irand(70, 110) / diffK; } }
        moveX(e); if (e.hitWall) e.vx = -e.vx; moveY(e, false);
        if (!wasGround && e.onGround && Math.abs(e.x - P.x) < 500) { shake = Math.max(shake, 3); dust(e.x + e.w / 2, e.y + e.h, 5); }
      } else {
        e.vy = Math.min(e.vy + GRAV, MAX_FALL);
        moveX(e); if (e.hitWall) e.vx = -e.vx;
        moveY(e, false);
        if (e.onGround) {   // Kante? -> umdrehen
          const fc = e.vx > 0 ? Math.floor((e.x + e.w + 2) / T) : Math.floor((e.x - 2) / T), br = Math.floor((e.y + e.h + 4) / T);
          const below = tileAt(fc, br); if (!solid(below) && below !== '-') e.vx = -e.vx;
        }
        e.facing = Math.sign(e.vx) || e.facing;
      }
      if (e.y > H + 40) e.dead = 99;
    }
    L.enemies = L.enemies.filter((e) => e.dead < 30);
  }
  function killEnemy(e, how) {
    e.dead = 1; run.kills++; L.killsHere++;
    const pts = how === 'stomp' ? Math.min(100 * Math.pow(2, P.combo), 1600) : 100;
    run.score += pts; popup(e.x + e.w / 2, e.y, `+${pts}`, '#ffffff');
    burst(e.x + e.w / 2, e.y + e.h / 2, enemyColor(e.type), 14); SFX.stomp(); shake = Math.max(shake, 4);
  }
  const enemyColor = (t) => ({ goblin: '#6fb84a', ork: '#5f8a3a', bat: '#6a3d8f', troll: '#8d9ab3', skelett: '#e8e2d0' }[t]);

  // =====================================================================
  //  PLATTFORMEN, SÄGEN, TREFFER
  // =====================================================================
  function updatePlatforms() {
    for (const pl of L.plats) {
      const ox = pl.x, oy = pl.y; pl.t++;
      if (pl.kind === 'M') pl.x = pl.x0 + Math.sin(pl.t * 0.02) * 80;
      else if (pl.kind === 'V') pl.y = pl.y0 + Math.sin(pl.t * 0.025) * 80;
      else if (pl.kind === 'C') {
        if (pl.gone > 0) { if (--pl.gone === 0) { pl.y = pl.y0; pl.fall = false; pl.load = 0; pl.vy = 0; } }
        else if (pl.fall) { pl.vy += 0.5; pl.y += pl.vy; if (pl.y > H + 50) pl.gone = 180; }
        else if (P.ride === pl) { if (++pl.load === 1) SFX.crumble(); if (pl.load > 26) { pl.fall = true; if (P.ride === pl) P.ride = null; } }
      }
      pl.dx = pl.x - ox; pl.dy = pl.y - oy;
    }
    for (const s of L.saws) { s.t++; s.y = s.y0 + Math.sin(s.t * 0.04) * 55; }
  }

  function checkHits() {
    const p = P, box = { x: p.x, y: p.y, w: p.w, h: p.h };
    // Löcher & Lava
    if (p.y > H + 40) { fallDeath(false); return; }
    const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - 0.01) / T), r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - 0.01) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      const ch = tileAt(c, r);
      if (ch === 'L' && p.y + p.h > r * T + 14) { fallDeath(true); return; }
      if (ch === '^' && overlap(box, { x: c * T + 4, y: r * T + 20, w: T - 8, h: T - 20 })) hurt();
    }
    // Sägen
    for (const s of L.saws) { const cx = clamp(s.x, p.x, p.x + p.w), cy = clamp(s.y, p.y, p.y + p.h); if ((cx - s.x) ** 2 + (cy - s.y) ** 2 < (s.r - 2) ** 2) hurt(); }
    // Gegner
    for (const e of L.enemies) {
      if (e.dead || !overlap(box, e)) continue;
      if (p.pw.U > 0) { killEnemy(e, 'shield'); continue; }
      const fromAbove = p.vy > 0 && p.prevBottom <= e.y + 10;
      if (fromAbove && e.type !== 'ork') { damageEnemy(e, e.type === 'troll' || e.type === 'skelett' ? 1 : 9, 0, 'stomp'); p.combo++; p.vy = keys.jump ? -13 : -9; p.sy = 1.2; p.sx = 0.85; }
      else if (fromAbove && e.type === 'ork') { p.vy = -9; hurt(false); }   // Stachelhelm!
      else if (e.hitT < 8 && !(e.frozen > 0)) hurt();
    }
    // Schüsse
    for (const s of L.shots) {   // Pfeile, Bolzen, Zauberkugeln und Feuerwellen
      if (s.kind === 'magic') {   // Zauberkugel lenkt zum nächsten Gegner
        let best = null, bd = 260;
        for (const e of L.enemies) if (!e.dead) { const d = Math.hypot(e.x + e.w / 2 - s.x, e.y + e.h / 2 - s.y); if (d < bd) { bd = d; best = e; } }
        if (!best && L.boss && L.boss.active && !L.boss.dead) best = L.boss;
        if (best) { const dy = best.y + best.h / 2 - s.y; s.vy = clamp(s.vy + Math.sign(dy) * 0.35, -4, 4); }
        if (frame % 2 === 0) L.particles.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 14, max: 14, size: 3, color: '#b388ff', g: 0 });
      }
      s.x += s.vx; s.y += s.vy || 0; s.life--;
      const col = s.kind === 'flame' ? '#ff7b2b' : s.kind === 'magic' ? '#b388ff' : '#d9a066', sb = { x: s.x - 8, y: s.y - 8, w: 16, h: 16 };
      if (solid(tileAt(Math.floor(s.x / T), Math.floor(s.y / T)))) { s.life = 0; burst(s.x, s.y, col, 6); }
      for (const e of L.enemies) if (!e.dead && s.life > 0 && overlap(sb, e) && damageEnemy(e, s.dmg, Math.sign(s.vx), 'shot') && s.kind !== 'flame') s.life = 0;
      const B = L.boss;
      if (B && B.active && !B.dead && s.life > 0 && !(B.alpha < 0.6) && overlap(sb, B)) { s.life = 0; if (B.inv <= 0) bossHit(s.dmg); else burst(s.x, s.y, '#ffffff', 4); }
      if (s.kind === 'flame' && frame % 2 === 0) L.particles.push({ x: s.x, y: s.y + rand(-8, 8), vx: 0, vy: rand(-1.5, -0.5), life: 14, max: 14, size: rand(2, 4), color: '#ffb238', g: 0 });
    }
    L.shots = L.shots.filter((s) => s.life > 0);
    // Münzen
    for (const co of L.coins) if (!co.taken && Math.abs(co.x - (p.x + p.w / 2)) < 22 && Math.abs(co.y - (p.y + p.h / 2)) < 28) {
      co.taken = true; run.coins++; L.coinsHere++; run.score += 10; SFX.coin(); sparkle(co.x, co.y, '#ffd23f');
      if (run.coins % 50 === 0 && p.hearts < MAX_HEARTS) { p.hearts++; popup(co.x, co.y - 20, '+1 ♥', '#ff4d6d'); }
    }
    L.coins = L.coins.filter((c) => !c.taken);
    // Power-ups
    for (const it of L.items) if (!it.taken && Math.abs(it.x - (p.x + p.w / 2)) < 26 && Math.abs(it.y - (p.y + p.h / 2)) < 30) {
      it.taken = true; run.score += 50; SFX.power(); ring(it.x, it.y, ITEM[it.kind].color); sparkle(it.x, it.y, ITEM[it.kind].color);
      if (it.kind === 'H') p.hearts = Math.min(MAX_HEARTS, p.hearts + 1);
      else if (WEAPON_ITEM[it.kind]) { run.weapon = WEAPON_ITEM[it.kind]; SFX.clang(); }   // neue Waffe!
      else p.pw[it.kind] = DUR[it.kind];
      popup(it.x, it.y - 24, ITEM[it.kind].name, ITEM[it.kind].color);
    }
    L.items = L.items.filter((i) => !i.taken);
    // Checkpoint & Ziel
    L.checkpoints.forEach((cp, i) => {
      if (!cp.active && p.x + p.w > cp.x) { cp.active = true; L.cpIndex = i; L.spawn = { x: cp.x, y: cp.y + 60 + T - p.h }; SFX.check(); popup(cp.x, cp.y - 10, 'CHECKPOINT', '#ffd23f'); sparkle(cp.x + 20, cp.y + 10, '#ffd23f'); }
    });
    if (L.goal && overlap(box, L.goal)) levelClear();
  }
  const ITEM = {
    H: { color: '#ff4d6d', name: '+1 HERZ' }, F: { color: '#ffffff', name: 'FEDERSTIEFEL' }, X: { color: '#d9a066', name: 'BOGEN' },
    A: { color: '#c98b4a', name: 'AXT' }, Q: { color: '#ff7b2b', name: 'FLAMMENSCHWERT' }, D: { color: '#c9d1dc', name: 'SPEER' },
    T: { color: '#a7adbd', name: 'KRIEGSHAMMER' }, N: { color: '#b07a45', name: 'ARMBRUST' }, I: { color: '#9fe8ff', name: 'EISSCHWERT' }, J: { color: '#b388ff', name: 'ZAUBERSTAB' },
    U: { color: '#ffd23f', name: 'ZAUBERSCHILD' }, R: { color: '#7CFF6B', name: 'TEMPOTRANK' },
  };

  function levelClear() {
    scene = 'clear'; sceneT = 0; music.on = false; SFX.clear();
    const secs = Math.floor(L.time / 60), timeBonus = Math.max(0, 300 - secs) * 5, heartBonus = P.hearts * 200;
    L.tally = { coins: L.coinsHere, kills: L.killsHere, secs, timeBonus, heartBonus };
    run.score += timeBonus + heartBonus; run.hearts = P.hearts;
  }

      ctx.beginPath(); ctx.moveTo(-6, -17); ctx.lineTo(-5, -23); ctx.lineTo(-2, -18); ctx.fill(); ctx.beginPath(); ctx.moveTo(6, -17); ctx.lineTo(5, -23); ctx.lineTo(2, -18); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-2, -30); ctx.lineTo(-12, -20 + Math.sin(t * 0.2) * 3); ctx.stroke();
      ctx.beginPath(); ctx.arc(-1, -38, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-6, -34, 10, 5);
      ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(-4, -38, 2.2, 0, Math.PI * 2); ctx.arc(2, -38, 2.2, 0, Math.PI * 2); ctx.fill();

  function eyes(x, y, r, pupil, angry) {

  function drawItem(it) {

    else if (WEAPON_ITEM[it.kind]) weaponIcon(WEAPON_ITEM[it.kind], 0, 0, 0.62);
    else if (it.kind === 'U') { ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(9, -6); ctx.lineTo(7, 4); ctx.lineTo(0, 11); ctx.lineTo(-7, 4); ctx.lineTo(-9, -6); ctx.closePath(); ctx.fill(); }
    else if (it.kind === 'R') { ctx.beginPath(); ctx.arc(0, 4, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-2.5, -8, 5, 7); ctx.fillStyle = '#b07a45'; ctx.fillRect(-3, -11, 6, 4); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-2, 2, 2, 0, Math.PI * 2); ctx.fill(); }   // Trank

  function heart(x, y, s, color) {

    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.fill();
  }

  // =====================================================================
  //  ZEICHNEN: Szene
  // =====================================================================
  function drawBackground() {
    const th = L.theme, sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    if (L.def.theme === 'festung') {   // Mond
      ctx.save(); ctx.fillStyle = '#f4ecd0'; ctx.shadowColor = '#fff6d8'; ctx.shadowBlur = 50; ctx.beginPath(); ctx.arc(620, 110, 46, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = 'rgba(200,190,160,.5)'; ctx.beginPath(); ctx.arc(605, 100, 9, 0, Math.PI * 2); ctx.arc(638, 125, 6, 0, Math.PI * 2); ctx.fill();
    }
    if (L.def.theme === 'wald') {   // Mond hinter den Bäumen
      ctx.save(); ctx.fillStyle = '#e8f0d8'; ctx.shadowColor = '#e8f8d8'; ctx.shadowBlur = 40; ctx.beginPath(); ctx.arc(170, 95, 34, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (L.def.theme === 'himmel') {   // große Abendsonne
      ctx.save(); ctx.fillStyle = 'rgba(255,236,170,.95)'; ctx.shadowColor = '#fff0b0'; ctx.shadowBlur = 60; ctx.beginPath(); ctx.arc(560, 330, 70, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (L.def.theme === 'wiese') {

    }

    }

        const x = ((tx - cam * 0.45) % 1600 + 1600) % 1600 - 1600 + off; if (x < -60 || x > W + 60) continue;
        const fl = 1 + Math.sin(frame * 0.4 + tx) * 0.15 + Math.random() * 0.1;
        const g = ctx.createRadialGradient(x, 318, 2, x, 318, 70 * fl); g.addColorStop(0, 'rgba(255,170,60,.45)'); g.addColorStop(1, 'rgba(255,120,30,0)');
        ctx.fillStyle = g; ctx.fillRect(x - 80, 240, 160, 160);
        ctx.fillStyle = '#ff7b2b'; ctx.beginPath(); ctx.moveTo(x - 6, 326); ctx.quadraticCurveTo(x - 7, 314, x, 300 - 6 * fl); ctx.quadraticCurveTo(x + 7, 314, x + 6, 326); ctx.fill();
        ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.moveTo(x - 3, 326); ctx.quadraticCurveTo(x - 3, 318, x, 310 - 3 * fl); ctx.quadraticCurveTo(x + 3, 318, x + 3, 326); ctx.fill();
      }
    }
    if (L.def.theme === 'wald') {   // Nebelschwaden
      ctx.fillStyle = 'rgba(200,230,220,.07)';
      for (let k = 0; k < 4; k++) { const x = ((k * 520 - cam * 0.6 - frame * 0.3) % 2080 + 2080) % 2080 - 300; ctx.beginPath(); ctx.ellipse(x, 430 + k * 28, 320, 42, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    if (L.def.theme === 'wiese' || L.def.theme === 'himmel') {
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      for (let k = 0; k < 6; k++) { const x = ((k * 260 - cam * 0.3 - frame * 0.2) % 1560 + 1560) % 1560 - 200, y = 60 + (k % 3) * 45;
        ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI * 2); ctx.arc(x + 26, y - 10, 26, 0, Math.PI * 2); ctx.arc(x + 54, y, 20, 0, Math.PI * 2); ctx.fill(); }
    }

        else if (L.theme.particle === 'snow') { b.y += b.v * 1.6; b.x += Math.sin(b.ph) * 0.6; if (b.y > H + 5) { b.y = -5; b.x = rand(0, W); } ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.s + 0.5, 0, Math.PI * 2); ctx.fill(); continue; }
        else if (L.theme.particle === 'glow') { b.x += Math.sin(b.ph) * 0.5; b.y += Math.cos(b.ph * 0.7) * 0.35; if (b.y < 200) b.y = rand(250, 560); ctx.fillStyle = `rgba(220,255,120,${0.25 + Math.sin(b.ph * 2) * 0.3})`; }

        ctx.fillRect(b.x, b.y, b.s, b.s);

  }

  function drawWorld() {
    const cx = Math.round(cam);
    // Kacheln (Ausschnitt)
    ctx.drawImage(tileLayer, cx, 0, W, H, 0, 0, W, H);
    ctx.save(); ctx.translate(-cx, 0);
    // Lava
    const c0 = Math.floor(cam / T), c1 = c0 + Math.ceil(W / T) + 1;
    for (let c = c0; c <= c1; c++) for (let r = 0; r < ROWS; r++) if (tileAt(c, r) === 'L') {
      const x = c * T, y = r * T, isTop = tileAt(c, r - 1) !== 'L';
      const gr = ctx.createLinearGradient(0, y, 0, y + T); gr.addColorStop(0, '#ffb238'); gr.addColorStop(1, '#d6371a');
      ctx.fillStyle = gr;
      if (isTop) { ctx.beginPath(); ctx.moveTo(x, y + T);
        for (let k = 0; k <= 8; k++) ctx.lineTo(x + k * 5, y + 10 + Math.sin(frame * 0.08 + (x + k * 5) * 0.08) * 4);
        ctx.lineTo(x + T, y + T); ctx.fill();
        if (Math.random() < 0.01) L.particles.push({ x: x + rand(0, T), y: y + 10, vx: rand(-0.5, 0.5), vy: rand(-4, -2), life: 30, max: 30, size: 4, color: '#ffb238', g: 0.15 });
      } else ctx.fillRect(x, y, T, T);
    }
    // Plattformen
    for (const pl of L.plats) {
      if (pl.gone > 0) continue;
      const shakeX = pl.kind === 'C' && pl.load > 0 && !pl.fall ? rand(-1.5, 1.5) : 0;
      if (pl.kind === 'C') {
        ctx.fillStyle = L.theme.block2; ctx.fillRect(pl.x + shakeX, pl.y, pl.w, pl.h);
        ctx.fillStyle = L.theme.block; ctx.fillRect(pl.x + 2 + shakeX, pl.y + 2, pl.w - 4, pl.h - 5);
        ctx.strokeStyle = L.theme.block2; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pl.x + 12 + shakeX, pl.y + 2); ctx.lineTo(pl.x + 18 + shakeX, pl.y + 9); ctx.lineTo(pl.x + 26 + shakeX, pl.y + 5); ctx.stroke();
      } else {
        if (pl.kind === 'V') { ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2; for (const rx of [8, pl.w - 8]) { ctx.beginPath(); ctx.moveTo(pl.x + rx, pl.y); ctx.lineTo(pl.x + rx, pl.y - 500); ctx.stroke(); } }   // Seile
        else { ctx.strokeStyle = '#6b7484'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); for (const rx of [6, pl.w - 6]) { ctx.beginPath(); ctx.moveTo(pl.x + rx, pl.y); ctx.lineTo(pl.x + pl.w / 2, pl.y - 26); ctx.stroke(); } ctx.setLineDash([]); }
        ctx.fillStyle = '#7a5230'; roundRect(ctx, pl.x, pl.y, pl.w, pl.h, 3); ctx.fill();
        ctx.fillStyle = '#9a6b3e'; ctx.fillRect(pl.x + 2, pl.y + 2, pl.w - 4, 5);
        ctx.fillStyle = '#4a3220'; for (const lx of [26, 53]) ctx.fillRect(pl.x + lx, pl.y, 2, pl.h);
        ctx.fillStyle = '#6b7484'; for (const rx of [3, pl.w - 9]) ctx.fillRect(pl.x + rx, pl.y, 6, pl.h);
      }
    }
    // Stachelkugeln an Ketten
    for (const s of L.saws) {
      const top = s.y0 - 100;
      ctx.strokeStyle = '#6b7484'; ctx.lineWidth = 3; ctx.setLineDash([5, 3]); ctx.beginPath(); ctx.moveTo(s.x0, top); ctx.lineTo(s.x, s.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#4a4f5c'; ctx.fillRect(s.x0 - 8, top - 4, 16, 6);
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.sin(frame * 0.05 + s.x0) * 0.5);
      ctx.fillStyle = '#c9d1dc';
      for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(Math.cos(a - 0.28) * 12, Math.sin(a - 0.28) * 12); ctx.lineTo(Math.cos(a) * (s.r + 6), Math.sin(a) * (s.r + 6)); ctx.lineTo(Math.cos(a + 0.28) * 12, Math.sin(a + 0.28) * 12); ctx.fill(); }
      const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 15); g.addColorStop(0, '#9aa0b2'); g.addColorStop(1, '#2a2d38');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // Checkpoint
    // Tore der Boss-Arena
    if (L.arena) for (const col of [L.arena.gl, L.arena.gr]) for (let r = 0; r < ROWS; r++) {
      if (L.map[r][col] !== 'G') continue; const x = col * T, y = r * T;
      ctx.fillStyle = 'rgba(20,16,30,.55)'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#5b5f6e'; for (let k = 0; k < 4; k++) ctx.fillRect(x + 4 + k * 10, y, 4, T);
      ctx.fillStyle = '#8a8fa0'; ctx.fillRect(x, y + 16, T, 5);
    }
    for (const cp of L.checkpoints) {
      cp.raise += ((cp.active ? 1 : 0) - cp.raise) * 0.08;
      ctx.fillStyle = '#6b4a2b'; ctx.fillRect(cp.x, cp.y, 5, 100); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(cp.x + 2.5, cp.y, 4, 0, Math.PI * 2); ctx.fill();
      const fy = cp.y + 6 + (1 - cp.raise) * 50, wv = Math.sin(frame * 0.15 + cp.x) * 2;
      ctx.fillStyle = cp.active ? '#c8102e' : '#6b7484';
      ctx.beginPath(); ctx.moveTo(cp.x + 5, fy); ctx.lineTo(cp.x + 32, fy + wv); ctx.lineTo(cp.x + 32, fy + 26 + wv); ctx.lineTo(cp.x + 18, fy + 19 + wv); ctx.lineTo(cp.x + 5, fy + 26); ctx.closePath(); ctx.fill();
      if (cp.active) { ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(cp.x + 18, fy + 4 + wv); ctx.lineTo(cp.x + 23, fy + 10 + wv); ctx.lineTo(cp.x + 18, fy + 16 + wv); ctx.lineTo(cp.x + 13, fy + 10 + wv); ctx.fill(); }
    }
    // Ziel
    const gl = L.goal;
    if (gl) {   // Burgtor mit Licht
      const pulse = 0.6 + Math.sin(frame * 0.08) * 0.25, bx = gl.x - 26, by = gl.y - 24, bw = gl.w + 52, bh = gl.h + 24;
      ctx.fillStyle = '#7d7890'; ctx.fillRect(bx, by, bw, bh);
      for (let k = 0; k < bw; k += 16) ctx.fillRect(bx + k, by - 10, 10, 10);
      ctx.fillStyle = '#5f5a70'; for (let r = 1; r * 14 < bh; r++) { ctx.fillRect(bx, by + r * 14, bw, 2); for (let k = (r % 2) * 12; k < bw; k += 24) ctx.fillRect(bx + k, by + r * 14 - 12, 2, 12); }
      ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.moveTo(gl.x, gl.y + gl.h); ctx.lineTo(gl.x, gl.y + 30); ctx.arc(gl.x + gl.w / 2, gl.y + 30, gl.w / 2, Math.PI, 0); ctx.lineTo(gl.x + gl.w, gl.y + gl.h); ctx.fill();
      ctx.save(); ctx.shadowColor = '#ffd27a'; ctx.shadowBlur = 30 * pulse; ctx.fillStyle = `rgba(255,220,130,${0.45 + 0.3 * pulse})`;
      ctx.beginPath(); ctx.moveTo(gl.x + 4, gl.y + gl.h); ctx.lineTo(gl.x + 4, gl.y + 32); ctx.arc(gl.x + gl.w / 2, gl.y + 32, gl.w / 2 - 4, Math.PI, 0); ctx.lineTo(gl.x + gl.w - 4, gl.y + gl.h); ctx.fill(); ctx.restore();
      ctx.fillStyle = '#6b4a2b'; ctx.fillRect(bx + bw / 2 - 1, by - 50, 3, 40);
      const wv = Math.sin(frame * 0.12) * 3; ctx.fillStyle = '#c8102e';
      ctx.beginPath(); ctx.moveTo(bx + bw / 2 + 2, by - 50); ctx.lineTo(bx + bw / 2 + 30, by - 46 + wv); ctx.lineTo(bx + bw / 2 + 2, by - 32); ctx.fill();
      for (let k = 0; k < 3; k++) { const yy = gl.y + gl.h - ((frame * 1.2 + k * 40) % (gl.h - 20)); ctx.fillStyle = '#fff6d0'; ctx.fillRect(gl.x + 10 + k * 9, yy, 3, 3); }
    }
    // Münzen & Items
    for (const co of L.coins) {
      co.t += 0.08; const sw = Math.abs(Math.cos(co.t)) * 10 + 1.5;
      ctx.fillStyle = '#c98a00'; ctx.beginPath(); ctx.ellipse(co.x, co.y, sw + 1.5, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(co.x, co.y, sw, 10.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(co.x - sw * 0.3, co.y - 6, Math.max(1, sw * 0.3), 8);
    }
    for (const it of L.items) { it.t++; drawItem(it); }
    // Gegner & Boss
    for (const e of L.enemies) drawEnemy(e);
    if (L.boss) drawBoss(L.boss);
    drawBossShots();
    // Pfeile und Feuerwellen
    for (const s of L.shots) {
      ctx.save(); ctx.translate(s.x, s.y); ctx.scale(Math.sign(s.vx), 1);
      if (s.kind === 'bolt') {
        ctx.fillStyle = '#5a3a1f'; ctx.fillRect(-14, -2, 18, 4); ctx.fillStyle = '#c9d1dc'; ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(11, 0); ctx.lineTo(4, 5); ctx.fill();
      } else if (s.kind === 'magic') {
        ctx.shadowColor = '#b388ff'; ctx.shadowBlur = 18; ctx.fillStyle = '#b388ff'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      } else if (s.kind === 'arrow') {
        ctx.strokeStyle = '#d9a066'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(4, 0); ctx.stroke();
        ctx.fillStyle = '#c9d1dc'; ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(10, 0); ctx.lineTo(4, 4); ctx.fill();
        ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-20, -4); ctx.lineTo(-13, 0); ctx.lineTo(-20, 4); ctx.fill();
      } else {
        const k = s.life / 30; ctx.globalAlpha = Math.min(1, k * 1.5); ctx.shadowColor = '#ff7b2b'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#ff7b2b'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 16, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.ellipse(2, 0, 5, 10, 0, -Math.PI / 2, Math.PI / 2); ctx.fill();
      }
      ctx.restore();
    }
    // Spieler
    const p = P;
    for (const tr of p.trail) drawHero(tr.x + p.w / 2, tr.y + p.h, tr.facing, 1, 1, 0, true, 0, tr.life / 30, frame, -1, run.weapon);
    const blink = p.inv > 0 && !p.dead && Math.floor(p.inv / 4) % 2 === 0;
    if (!blink) {
      ctx.save();
      if (p.dead) { ctx.translate(p.x + p.w / 2, p.y + p.h / 2); ctx.rotate(sceneT * 0.15); ctx.translate(-(p.x + p.w / 2), -(p.y + p.h / 2)); }
      const wp = WEAPONS[run.weapon];
      drawHero(p.x + p.w / 2, p.y + p.h, p.facing, p.sx, p.sy, p.walk, p.onGround, p.vy, 1, frame, p.atk > 0 ? 1 - p.atk / wp.swing : -1, run.weapon);
      ctx.restore();
    }
    if (p.pw.U > 0) {
      const a = p.pw.U < 120 && Math.floor(p.pw.U / 6) % 2 ? 0.25 : 0.55;
      ctx.save(); ctx.strokeStyle = `rgba(255,210,63,${a + 0.3})`; ctx.fillStyle = `rgba(255,210,63,${a * 0.3})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + p.h / 2 - 4, 34 + Math.sin(frame * 0.2) * 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    // Partikel
    for (const q of L.particles) {
      const a = q.life / q.max; ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = q.color; ctx.strokeStyle = q.color;
      if (q.ring) { ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(q.x, q.y, (1 - a) * 46 + 6, 0, Math.PI * 2); ctx.stroke(); }
      else if (q.star) { ctx.fillRect(q.x - 1, q.y - q.size, 2, q.size * 2); ctx.fillRect(q.x - q.size, q.y - 1, q.size * 2, 2); }
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + a * 0.6), 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    for (const pp of L.popups) outlined(pp.text, pp.x, pp.y, 18, pp.color, Math.min(1, pp.life / 20));
    ctx.restore();
  }

  function outlined(text, x, y, size, color, alpha = 1, align = 'center', font = FONT) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.font = font(size); ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(20,14,30,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(text, x, y);
    ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore();
  }

  function drawHUD() {
    const p = P;
    for (let i = 0; i < MAX_HEARTS; i++) {
      const x = 28 + i * 30, y = 30;
      if (i < p.hearts) { heart(x, y + 1, 11, '#2a1020'); heart(x, y, 10, '#ff4d6d'); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x - 4, y - 3, 2.5, 0, Math.PI * 2); ctx.fill(); }
      else if (i < 3) { heart(x, y, 10, 'rgba(20,14,30,.45)'); }
    }
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(30, 66, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
    outlined(`× ${run.coins}`, 44, 66, 22, '#ffffff', 1, 'left');
    outlined(`${L.def.name.toUpperCase()}`, W / 2, 24, 22, '#ffffff');
    outlined(`LEVEL ${levelIndex + 1} / ${LEVELS.length}`, W / 2, 48, 14, '#ffd23f', 1, 'center', UIF);
    outlined(String(run.score).padStart(6, '0'), W - 20, 28, 26, '#ffffff', 1, 'right');
    const s = Math.floor(L.time / 60);
    outlined(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`, W - 20, 58, 18, '#d8e8ff', 1, 'right', UIF);
    // Power-ups
    let k = 0;
    for (const key of ['F', 'U', 'R']) {
      if (p.pw[key] <= 0) continue;
      const x = W - 40 - k * 50, y = 96, info = ITEM[key];
      ctx.save(); ctx.translate(x, y); ctx.scale(0.8, 0.8); drawItem({ kind: key, x: 0, y: 0, t: 0 }); ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x - 18, y + 20, 36, 5);
      ctx.fillStyle = info.color; ctx.fillRect(x - 18, y + 20, 36 * p.pw[key] / DUR[key], 5);
      k++;
    }
    // aktuelle Waffe
    const wk = run.weapon, wi = WEAPONS[wk];
    ctx.fillStyle = 'rgba(20,14,30,.45)'; roundRect(ctx, 14, 86, 168, 34, 10); ctx.fill();
    weaponIcon(wk, 34, 103, 0.62);
    outlined(wi.name, 54, 98, 13, wi.color, 1, 'left', UIF);
    outlined('X = ANGRIFF', 54, 112, 11, '#d8e8ff', 0.85, 'left', UIF);
    const B = L.boss;
    if (B && B.active && B.dead < 120) {
      const w = 360, x = W / 2 - w / 2, y = H - 30;
      ctx.fillStyle = 'rgba(20,14,30,.75)'; roundRect(ctx, x - 8, y - 30, w + 16, 50, 10); ctx.fill();
      outlined(B.name, W / 2, y - 13, 17, '#ffffff');
      ctx.fillStyle = '#3a2a3a'; roundRect(ctx, x, y, w, 12, 6); ctx.fill();
      if (B.hp > 0) { ctx.fillStyle = B.color; roundRect(ctx, x, y, Math.max(12, w * B.hp / B.maxHp), 12, 6); ctx.fill(); }
    }
  }

  function panel(x, y, w, h) {
    ctx.save(); ctx.fillStyle = 'rgba(20,14,30,.82)'; roundRect(ctx, x, y, w, h, 22); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }

  function drawTitle() {
    if (!L) loadLevel(0);
    cam = (frame * 1.2) % (L.w - W);
    drawBackground(); ctx.drawImage(tileLayer, Math.round(cam), 0, W, H, 0, 0, W, H);
    ctx.fillStyle = 'rgba(15,10,30,.35)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(frame * 0.05) * 6;
    outlined('JUMP & RUN', W / 2, 110 + bob, 84, '#ffd23f');
    outlined(`RITTER-EDITION  ·  ${LEVELS.length} Level · ${LEVELS.filter((l) => l.boss).length} Bosse · ${Object.keys(WEAPONS).length} Waffen`, W / 2, 172, 22, '#ffffff', 1, 'center', UIF);
    const ph = frame % 100 < 14 ? (frame % 100) / 14 : -1;
    drawHero(W / 2, 306, 1, 1.5, 1.5, frame * 0.25, true, 0, 1, frame, ph, 'schwert');
    ctx.save(); ctx.translate(W / 2 + 100, 306); ctx.scale(1.3, 1.3); drawEnemy({ type: 'ork', x: -15, y: -38, w: 30, h: 38, t: frame, facing: -1, dead: 0, hitT: 0, maxHp: 1, hp: 1 }); ctx.restore();
    ctx.save(); ctx.translate(W / 2 - 110, 306); ctx.scale(1.3, 1.3); drawEnemy({ type: 'troll', x: -19, y: -46, w: 38, h: 46, t: frame, facing: 1, dead: 0, hitT: 0, maxHp: 1, hp: 1, onGround: true, timer: 99 }); ctx.restore();
    ctx.save(); ctx.translate(W / 2 + 190, 250 + Math.sin(frame * 0.07) * 8); ctx.scale(1.3, 1.3); drawEnemy({ type: 'bat', x: -17, y: -22, w: 34, h: 22, t: frame, facing: -1, dead: 0, hitT: 0, maxHp: 1, hp: 1 }); ctx.restore();
    // Levelwahl
    const d = LEVELS[sel];
    panel(W / 2 - 250, 330, 500, 64);
    outlined(`${sel > 0 ? '◀  ' : '    '}LEVEL ${sel + 1}: ${d.name}${sel < unlocked - 1 ? '  ▶' : '    '}`, W / 2, 352, 24, '#ffffff');
    outlined(d.boss ? `BOSS: ${BOSSES[d.boss].name}` : (unlocked > 1 ? `← → Level wählen  ·  ↑ ↓ 5 Level  (${unlocked} freigeschaltet)` : 'Weitere Level werden beim Spielen freigeschaltet'), W / 2, 378, 14, d.boss ? '#ff4d6d' : '#d8e8ff', 1, 'center', UIF);
    const a = 0.6 + Math.sin(frame * 0.1) * 0.4;
    outlined('ENTER ODER TIPPEN ZUM STARTEN', W / 2, 438, 28, '#ffffff', a);
    outlined('← → laufen   ·   Leertaste springen   ·   X angreifen   ·   P Pause   ·   M Sound', W / 2, 488, 15, '#d8e8ff', 1, 'center', UIF);
    outlined(`BESTER SCORE  ${String(best).padStart(6, '0')}`, W / 2, 536, 22, '#ffd23f');
  }

  function draw() {
    if (scene === 'title') { drawTitle(); return; }
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
    drawBackground(); drawWorld();
    ctx.restore();
    drawHUD();
    if (scene === 'intro') {
      const a = Math.min(1, sceneT / 15, (110 - sceneT) / 15);
      ctx.save(); ctx.globalAlpha = Math.max(0, a); panel(W / 2 - 220, 190, 440, 160);
      outlined(`LEVEL ${levelIndex + 1} / ${LEVELS.length}`, W / 2, 240, 30, '#ffd23f');
      outlined(L.def.name, W / 2, 290, 50, '#ffffff');
      if (L.def.boss) outlined('BOSS-LEVEL', W / 2, 332, 18, '#ff4d6d');
      ctx.restore();
    }
    if (L.boss && L.boss.active && L.boss.state === 'intro') {
      const st = L.boss.st, a = Math.max(0, Math.min(1, st / 15, (130 - st) / 20));
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(10,6,20,.6)'; ctx.fillRect(0, 196, W, 140);
      outlined('BOSS', W / 2, 224, 22, '#ff4d6d'); outlined(L.boss.name, W / 2, 268, 52, L.boss.color);
      outlined(L.boss.hint, W / 2, 312, 18, '#ffffff', 1, 'center', UIF); ctx.restore();
    }
    if (scene === 'clear') {
      panel(W / 2 - 230, 130, 460, 330);
      outlined('LEVEL GESCHAFFT!', W / 2, 180, 44, '#7CFF6B');
      const t = L.tally, rows = [['Münzen', `${t.coins}`], ['Gegner besiegt', `${t.kills}`], ['Zeit', `${Math.floor(t.secs / 60)}:${String(t.secs % 60).padStart(2, '0')}`], ['Zeitbonus', `+${t.timeBonus}`], ['Herzbonus', `+${t.heartBonus}`]];
      rows.forEach(([k2, v], i) => { if (sceneT > 20 + i * 12) { outlined(k2, W / 2 - 170, 240 + i * 36, 20, '#d8e8ff', 1, 'left', UIF); outlined(v, W / 2 + 170, 240 + i * 36, 22, '#ffffff', 1, 'right'); } });
      if (sceneT > 100) outlined(levelIndex + 1 < LEVELS.length ? 'ENTER / TIPPEN: WEITER' : 'ENTER / TIPPEN: ZUM FINALE', W / 2, 432, 18, '#ffd23f', 0.6 + Math.sin(frame * 0.1) * 0.4);
    }
    if (scene === 'gameover') {
      panel(W / 2 - 220, 170, 440, 240);
      outlined('GAME OVER', W / 2, 225, 56, '#ff4d6d');
      outlined(`Score ${String(run.score).padStart(6, '0')}`, W / 2, 290, 24, '#ffffff');
      outlined(L.cpIndex >= 0 ? 'ENTER / TIPPEN: Weiter ab Checkpoint' : 'ENTER / TIPPEN: Level neu starten', W / 2, 350, 18, '#ffd23f', 0.6 + Math.sin(frame * 0.1) * 0.4);
    }
    if (scene === 'victory') {
      panel(W / 2 - 260, 110, 520, 380);
      outlined('DU HAST ES GESCHAFFT!', W / 2, 160, 36, '#ffd23f');
      outlined(`Alle ${LEVELS.length} Level durchgespielt`, W / 2, 205, 20, '#ffffff', 1, 'center', UIF);
      const s = Math.floor(run.time / 60);
      [['Score', String(run.score).padStart(6, '0')], ['Münzen', run.coins], ['Gegner', run.kills], ['Gesamtzeit', `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`]]
        .forEach(([k2, v], i) => { outlined(k2, W / 2 - 190, 260 + i * 38, 20, '#d8e8ff', 1, 'left', UIF); outlined(String(v), W / 2 + 190, 260 + i * 38, 24, '#ffffff', 1, 'right'); });
      if (run.newBest) outlined('★ NEUER BESTER SCORE ★', W / 2, 425, 22, '#7CFF6B', 0.6 + Math.sin(frame * 0.15) * 0.4);
      outlined('ENTER / TIPPEN: Neues Spiel', W / 2, 462, 18, '#ffd23f');
      confetti();
    }
    if (paused) {
      ctx.fillStyle = 'rgba(15,10,30,.55)'; ctx.fillRect(0, 0, W, H);
      outlined('PAUSE', W / 2, H / 2 - 20, 64, '#ffffff');
      outlined('P oder Tippen: weiter', W / 2, H / 2 + 34, 18, '#d8e8ff', 1, 'center', UIF);
    }
    if (screenMsg) { outlined(screenMsg.t, W / 2, H - 40, 22, '#ffffff', Math.min(1, screenMsg.life / 15)); if (--screenMsg.life <= 0) screenMsg = null; }
  }
  const confettiParts = [];
  function confetti() {
    if (confettiParts.length < 120) confettiParts.push({ x: rand(0, W), y: -10, vy: rand(1.5, 3.5), vx: rand(-1, 1), r: rand(0, 6), c: ['#ffd23f', '#ff4d6d', '#2ec4b6', '#7CFF6B', '#ffffff'][irand(0, 4)] });
    for (const c of confettiParts) { c.y += c.vy; c.x += c.vx; c.r += 0.1; if (c.y > H) { c.y = -10; c.x = rand(0, W); }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore(); }
  }

  // =====================================================================
  //  ABLAUF
  // =====================================================================
  function update() {
    frame++;
    if (shake > 0) shake *= 0.85; if (shake < 0.4) shake = 0;
    if (scene === 'title' || paused) return;
    sceneT++;
    if (scene === 'intro') { updatePlatforms(); updateEnemies(); if (sceneT > 110) { scene = 'play'; music.on = true; } }
    else if (scene === 'play') {
      L.time++; run.time++;
      updatePlatforms(); updatePlayer(); updateEnemies(); updateBoss(); if (L.boss && L.boss.elite && frame % 3 === 0) updateBoss(); updateBossShots(); if (scene === 'play') checkHits();
      let target = clamp(P.x - W * 0.4 + P.facing * 60, 0, L.w - W);
      if (L.arena && L.arena.locked) target = L.arena.gl * T;   // Kamera bleibt in der Arena
      cam += (target - cam) * 0.1;
    } else if (scene === 'dying') {
      P.vy += 0.6; P.y += P.vy;
      if (sceneT > 90) scene = 'gameover';
    }
    if (L) {
      for (const q of L.particles) { q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
      L.particles = L.particles.filter((q) => q.life > 0);
      for (const pp of L.popups) { pp.y -= 0.8; pp.life--; }
      L.popups = L.popups.filter((pp) => pp.life > 0);
    }
  }

  function startLevel(i, keepRun, cpIndex = -1) {
    levelIndex = i; loadLevel(i, keepRun, cpIndex);
    if (i + 1 > unlocked) { unlocked = i + 1; store.set('jr_unlocked', unlocked); }
    scene = 'intro'; sceneT = 0; paused = false; music.on = false;
  }
  function onConfirm() {
    audioInit();
    if (scene === 'title') { startLevel(sel, false); SFX.check(); }
    else if (scene === 'gameover') { const sc = run.score, cpi = L.cpIndex; run.hearts = 3; startLevel(levelIndex, true, cpi); P.hearts = 3; run.score = Math.max(0, sc - 500); }
    else if (scene === 'clear' && sceneT > 100) {
      if (levelIndex + 1 < LEVELS.length) startLevel(levelIndex + 1, true);
      else { scene = 'victory'; sceneT = 0; run.newBest = run.score > best; if (run.newBest) { best = run.score; store.set('jr_best', best); } SFX.clear(); }
    }
    else if (scene === 'victory') { scene = 'title'; L = null; sel = unlocked - 1; }
    else if (paused) paused = false;
  }

  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 200); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }

  // =====================================================================
  //  EINGABE
  // =====================================================================
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (scene === 'title' && ['ArrowLeft', 'ArrowRight', 'a', 'A', 'd', 'D', 'ArrowUp', 'ArrowDown'].includes(k)) {
      e.preventDefault(); const dir = k === 'ArrowUp' ? 5 : k === 'ArrowDown' ? -5 : ['ArrowRight', 'd', 'D'].includes(k) ? 1 : -1;
      const n = clamp(sel + dir, 0, unlocked - 1); if (n !== sel) { sel = n; audioInit(); SFX.coin(); } return;
    }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { if (!keys.jump) jumpPressed = true; keys.jump = true; e.preventDefault(); audioInit(); }
    else if (k === 'x' || k === 'X' || k === 'f' || k === 'F') { if (!keys.shoot) shootPressed = true; keys.shoot = true; }
    else if (k === 'p' || k === 'P') { if (scene === 'play') paused = !paused; }
    else if (k === 'm' || k === 'M') toggleSound();
    else if (k === 'Enter') onConfirm();
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
    else if (k === 'x' || k === 'X' || k === 'f' || k === 'F') keys.shoot = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = keys.jump = keys.shoot = false; if (scene === 'play') paused = true; });
  const hold = (id, on, off) => {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); audioInit(); b.classList.add('on');
      if (scene === 'title' && (id === 'bl' || id === 'br')) { sel = clamp(sel + (id === 'br' ? 1 : -1), 0, unlocked - 1); return; }
      if (scene !== 'play' && scene !== 'intro') { onConfirm(); return; } on(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => { b.classList.remove('on'); off(); }));
  };
  hold('bl', () => { keys.left = true; }, () => { keys.left = false; });
  hold('br', () => { keys.right = true; }, () => { keys.right = false; });
  hold('jump', () => { jumpPressed = true; keys.jump = true; }, () => { keys.jump = false; });
  hold('shoot', () => { shootPressed = true; keys.shoot = true; }, () => { keys.shoot = false; });
  document.getElementById('snd').addEventListener('click', toggleSound);
  document.getElementById('pau').addEventListener('click', () => { if (scene === 'play') paused = !paused; });
  document.getElementById('stage').addEventListener('pointerdown', () => { if (scene !== 'play' && scene !== 'intro' && scene !== 'dying') onConfirm(); else if (paused) paused = false; });

  // Test-Hilfe
  window.__jr = { get P() { return P; }, get L() { return L; }, get scene() { return scene; }, get run() { return run; }, start: (i) => { audioInit(); startLevel(i || 0, false); }, keys, bossHit: (d) => bossHit(d), get unlocked() { return unlocked; } };

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
