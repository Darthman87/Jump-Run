<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K.I.T.S.">
<meta name="theme-color" content="#11141c">
<title>K.I.T.S. – Kommando Intergalaktischer Time-Springer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
  /* Layout: game screen (800x600 world, same as jump_and_run.py) in a rounded frame, touch controls below. Single committed dark frame around a colorful game. */
  :root {
    --bg: #10131c;
    --frame: #1a1f2c;
    --line: #2c3446;
    --fg: #eef2f8;
    --muted: #8d98ad;
    --accent: #ff7a3d;
    --teal: #2ec4b6;
    --ui: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    -webkit-user-select: none; user-select: none;
  }
  .stage, .pad, .help { width: 100%; max-width: 800px; }
  .stage { aspect-ratio: 4 / 3; max-height: 80vh; border-radius: 14px; overflow: hidden; border: 3px solid var(--line); background: #6ec6ff; touch-action: none; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .help { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  kbd { font-family: var(--ui); font-size: .74rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--fg); background: var(--frame); }
  .pad { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pad .grp { display: flex; gap: 10px; }
  .pad button {
    font: inherit; font-weight: 800; color: var(--fg); background: var(--frame); border: 2px solid var(--line);
    border-radius: 16px; height: 64px; min-width: 68px; padding: 0 12px; cursor: pointer; touch-action: none; font-size: 1.25rem;
  }
  .pad #jump { background: var(--accent); border-color: var(--accent); color: #1b0d05; min-width: 96px; font-size: .95rem; }
  .pad #shoot { color: var(--teal); min-width: 70px; font-size: .9rem; }
  .pad .small { min-width: 48px; font-size: .9rem; color: var(--muted); }
  .pad button.on { transform: scale(.95); filter: brightness(1.2); }
  .pad button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .pad #bu, .pad #bd { min-width: 54px; }
  @media (max-width: 520px) {   /* Handy hochkant: Ton/Pause in eine eigene Zeile */
    .pad { flex-wrap: wrap; gap: 6px; row-gap: 8px; } .pad .grp { gap: 6px; }
    .pad .grp:nth-child(2) { order: -1; width: 100%; justify-content: center; }
    .pad .grp:nth-child(2) button { height: 34px; }
    .pad button { min-width: 46px; height: 56px; padding: 0 6px; font-size: 1.05rem; }
    .pad #jump { min-width: 70px; font-size: .8rem; } .pad #shoot { min-width: 58px; font-size: .75rem; }
    .pad #bu, .pad #bd { min-width: 42px; } .pad .small { min-width: 44px; }
  }
  @media (max-width: 380px) {
    body { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
    .pad button { min-width: 38px; } .pad #jump { min-width: 56px; } .pad #shoot { min-width: 48px; } .pad #bu, .pad #bd { min-width: 36px; }
  }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
  /* ---------- Handy-Modus: Spiel füllt den Bildschirm, zwei Steuerkreise darüber ---------- */
  .tui { display: none; }
  body.touch { position: fixed; inset: 0; padding: 0; gap: 0; display: block; overflow: hidden; background: #05060a; -webkit-touch-callout: none; overscroll-behavior: none; }
  body.touch .pad, body.touch .help { display: none; }
  body.touch .stage { position: absolute; max-width: none; max-height: none; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
  body.touch .tui { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .tui .stick { position: absolute; border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.26); pointer-events: auto; touch-action: none; }
  .tui .stick::after { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: 1px dashed rgba(255,255,255,.14); }
  .tui .knob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; transform: translate(-50%, -50%); border-radius: 50%;
               background: rgba(255,255,255,.32); border: 2px solid rgba(255,255,255,.6); box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none; }
  .tui #stR { background: rgba(46,196,182,.08); border-color: rgba(46,196,182,.45); }
  .tui #stR .knob { background: rgba(46,196,182,.45); border-color: #2ec4b6; }
  .tui .stick.on .knob { filter: brightness(1.35); }
  .tui .btn { position: absolute; border-radius: 50%; pointer-events: auto; touch-action: none; display: grid; place-items: center;
              font: 800 .78rem var(--ui); letter-spacing: .04em; color: #fff; background: rgba(255,122,61,.5); border: 2px solid #ff7a3d;
              box-shadow: 0 4px 14px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; }
  .tui .btn.on { transform: scale(.92); filter: brightness(1.3); }
  .tui .mini { position: absolute; width: 44px; height: 40px; border-radius: 12px; pointer-events: auto; touch-action: none; display: grid; place-items: center;
               font: 800 1rem var(--ui); color: #fff; background: rgba(20,16,34,.55); border: 2px solid rgba(255,255,255,.28); -webkit-tap-highlight-color: transparent; }
  .tui .mini.on { filter: brightness(1.4); }
  .tui .lbl { position: absolute; font: 800 .66rem var(--ui); letter-spacing: .08em; color: rgba(255,255,255,.5); text-align: center; pointer-events: none; transform: translateX(-50%); white-space: nowrap; }
  .tui .hint { position: absolute; left: 50%; transform: translateX(-50%); font: 700 .78rem var(--ui); color: rgba(255,255,255,.6); text-align: center; pointer-events: none; }
</style>

</head>
<body>
<div class="stage" id="stage"><canvas id="game" width="800" height="600" aria-label="Jump and Run Spielfeld"></canvas></div>

<div class="pad" aria-label="Steuerung">
  <div class="grp">
    <button id="bl" type="button" aria-label="Links">◀</button>
    <button id="br" type="button" aria-label="Rechts">▶</button>
    <button id="bd" type="button" aria-label="Ducken">▼</button>
  </div>
  <div class="grp">
    <button id="snd" class="small" type="button" aria-label="Sound an oder aus">♪</button>
    <button id="pau" class="small" type="button" aria-label="Pause">II</button>
  </div>
  <div class="grp">
    <button id="bw" class="small" type="button" aria-label="Waffe wechseln">⇄</button>
    <button id="bu" type="button" aria-label="Nach oben zielen">▲</button>
    <button id="shoot" type="button">⚔ SCHLAG</button>
    <button id="jump" type="button">SPRUNG</button>
  </div>
</div>

<div class="tui" id="tui" aria-label="Touch-Steuerung">
  <div class="stick" id="stL"><div class="knob"></div></div>
  <div class="stick" id="stR"><div class="knob"></div></div>
  <div class="btn" id="tJump">SPRUNG</div>
  <div class="lbl" id="lbL">LAUFEN · ↑ SPRINGEN</div>
  <div class="lbl" id="lbR">ANGRIFF · ZIELEN</div>
  <div class="mini" id="tPause" aria-label="Pause">II</div>
  <div class="mini" id="tSnd" aria-label="Sound">♪</div>
  <div class="mini" id="tWeap" aria-label="Waffe wechseln">⇄</div>
  <div class="mini" id="tFull" aria-label="Vollbild">⛶</div>
  <div class="hint" id="tHint"></div>
</div>
<div id="safe" style="position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>

<div class="help">
  <span><kbd>←</kbd> <kbd>→</kbd> laufen</span>
  <span><kbd>Leertaste</kbd> springen (2× = Doppelsprung)</span>
  <span><kbd>↓</kbd> ducken</span>
  <span><kbd>X</kbd> angreifen</span>
  <span><kbd>↑</kbd>/<kbd>↓</kbd>+<kbd>X</kbd> nach oben / unten (in der Luft)</span>
  <span><kbd>C</kbd> Waffe wechseln</span>
  <span><kbd>P</kbd> Pause</span>
  <span><kbd>M</kbd> Sound</span>
</div>

<script>
(() => {

  const COYOTE = 7, BUFFER = 7, MAX_HEARTS = 5;
  const maxHearts = () => Math.min(8, MAX_HEARTS + ((run && run.extraHearts) || 0));

  // =====================================================================
  //  SPIELFIGUR

  function makePlayer(x, y) {
    return { x, y, w: 26, h: 38, vx: 0, vy: 0, prevBottom: y + 38, onGround: false, facing: 1, coyote: 0, buffer: 0, jumps: 0,
             inv: 0, hearts: 3, ride: null, sx: 1, sy: 1, walk: 0, blink: 0, combo: 0, atk: 0, atkCd: 0, dead: false,

  // Ducken: Hitbox wird niedriger. Aufstehen geht nur, wenn über dem Kopf Platz ist.
  function headroom(p) {

    for (let c = c0; c <= c1; c++) if (solid(tileAt(c, r))) return false;
    return true;
  }
  function setCrouch(p, on) {
    if (on === p.crouch) return;

    else if (headroom(p)) { p.crouch = false; p.y -= 14; p.h = 38; }
  }

  function updatePlayer() {
    const p = P;
    // Auf beweglicher Plattform mitfahren
    if (p.ride) { p.x += p.ride.dx; p.y += p.ride.dy; }

    const maxV = (p.pw.R > 0 ? TURBO_RUN : RUN) * (p.slow > 0 ? 0.45 : 1) * (p.mounted ? 1.2 : 1), acc = slip ? 0.2 : p.onGround ? ACC_GROUND : ACC_AIR;
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    setCrouch(p, keys.down && p.onGround && !p.dead && !p.mounted);   // auf dem Pferd kann man sich nicht ducken

    // Physik
    p.vy = Math.min(p.vy + L.grav, L.maxFall);
    p.prevBottom = p.y + p.h;
    const wasGround = p.onGround, fallSpeed = p.vy;
    moveX(p); moveY(p, true);
    for (const s of L.springs) {   // Sprungfeder
      if (p.vy >= 0 && p.x + p.w > s.x + 4 && p.x < s.x + T - 4 && p.y + p.h >= s.y - 2 && p.prevBottom <= s.y + 8) {
        p.y = s.y - p.h; p.vy = L.def.mond ? -15 : -20; p.onGround = false; p.jumps = 1; p.coyote = 0; s.sq = 1; p.sx = 0.7; p.sy = 1.35; SFX.spring(); ring(s.x + 20, s.y, '#ffffff');
      }
    }

      if (bt === '>' || bt === '<') { const v = p.vx; p.vx = bt === '>' ? 1.6 : -1.6; moveX(p); p.vx = v; }

  }

  // =====================================================================
  //  GEFÄHRTEN: Knappe, Falke, Prinzessin
  // =====================================================================
  function nearestFoe(x, y, maxD, withBoss) {
    let best = null, bd = maxD;
    for (const e of L.enemies) if (!e.dead) { const d = Math.hypot(e.x + e.w / 2 - x, e.y + e.h / 2 - y); if (d < bd) { bd = d; best = e; } }
    const B = L.boss;
    if (withBoss && B && B.active && !B.dead && !(B.alpha < 0.6)) { const d = Math.hypot(B.x + B.w / 2 - x, B.y + B.h / 2 - y); if (d < bd) best = B; }
    return best;
  }
  function follow(fw, dist, k) {   // läuft hinter dem Ritter her
    const p = P, tx = p.x + p.w / 2 - p.facing * dist, dx = tx - fw.x;
    fw.x += dx * k; fw.y += (p.y + p.h + (p.crouch ? 0 : 0) - fw.y) * 0.2;
    fw.facing = Math.abs(dx) > 3 ? Math.sign(dx) : p.facing;
    fw.walk += Math.min(0.45, Math.abs(dx * k) * 0.1);
  }
  function updateFriends() {
    const p = P, cx = p.x + p.w / 2;

        const tg = nearestFoe(s.x, s.y - 20, 300, true);
        if (tg) {
          const tx = tg.x + tg.w / 2, ty = tg.y + tg.h / 2, d = Math.hypot(tx - s.x, ty - (s.y - 20)) || 1, kind = squireLook(L.era)[1];
          L.shots.push({ kind, aim: true, color: kind === 'laser' ? '#5ef2ff' : kind === 'plasma' ? '#7CFF6B' : undefined, x: s.x, y: s.y - 20, vx: (tx - s.x) / d * 8, vy: (ty - (s.y - 20)) / d * 8, life: 50, dmg: 1 });
          s.facing = tx > s.x ? 1 : -1; s.throwT = 12; s.cd = 80; SFX.swing();
        } else s.cd = 10;
      }
    }
    if (L.princess) follow(L.princess, L.squire ? 84 : 44, 0.08);

      const hx = cx - p.facing * (L.squire ? 78 : 50), hy = p.y + p.h;
      if (dg.state === 'fly') {
        const dx = hx - dg.x; dg.x += dx * 0.1; dg.y += (hy - dg.y) * 0.25; dg.facing = Math.abs(dx) > 3 ? Math.sign(dx) : p.facing; dg.walk += Math.min(0.5, Math.abs(dx) * 0.012); dg.leap = 0;
        if (--dg.cd <= 0) { const tg = nearestFoe(dg.x, dg.y - 14, 240, false); if (tg) { dg.state = 'dive'; dg.target = tg; SFX.jump2(); } else dg.cd = 20; }
      } else if (dg.state === 'dive') {
        const tg = dg.target;
        if (!tg || tg.dead) dg.state = 'back';
        else {
          const dx = tg.x + tg.w / 2 - dg.x, dy = tg.y + tg.h - dg.y, d = Math.hypot(dx, dy);
          dg.facing = dx > 0 ? 1 : -1; dg.leap = 1;
          if (d < 18) { damageEnemy(tg, 1, dg.facing, 'shot'); dg.state = 'back'; SFX.stomp(); }
          else { dg.x += dx / d * 8; dg.y += dy / d * 8; }
        }
      } else {
        dg.x += (hx - dg.x) * 0.15; dg.y += (hy - dg.y) * 0.15; dg.leap = 0.5;
        if (Math.hypot(hx - dg.x, hy - dg.y) < 14) { dg.state = 'fly'; dg.cd = 140; }
      }
      for (const co of L.coins) {   // Münzen zum Helden bringen
        const dx = cx - co.x, dy = p.y + p.h / 2 - co.y, d = Math.hypot(dx, dy);

    }
    if (L.parrot) {   // Papagei: fliegt über dem Helden, hackt nach Gegnern, sammelt Münzen
      const pa = L.parrot; pa.t++;

      if (pa.state === 'fly') {
        pa.x += (hx - pa.x) * 0.12; pa.y += (hy - pa.y) * 0.12; pa.facing = Math.abs(hx - pa.x) > 4 ? Math.sign(hx - pa.x) : p.facing;
        if (--pa.cd <= 0) { const tg = nearestFoe(pa.x, pa.y, 260, false); if (tg) { pa.state = 'dive'; pa.target = tg; } else pa.cd = 20; }
      } else if (pa.state === 'dive') {
        const tg = pa.target;
        if (!tg || tg.dead) pa.state = 'back';
        else { const dx = tg.x + tg.w / 2 - pa.x, dy = tg.y + tg.h / 3 - pa.y, d = Math.hypot(dx, dy) || 1; pa.facing = dx > 0 ? 1 : -1;
          if (d < 16) { damageEnemy(tg, 1, pa.facing, 'shot'); pa.state = 'back'; SFX.stomp(); } else { pa.x += dx / d * 7; pa.y += dy / d * 7; } }
      } else { pa.x += (hx - pa.x) * 0.15; pa.y += (hy - pa.y) * 0.15; if (Math.hypot(hx - pa.x, hy - pa.y) < 14) { pa.state = 'fly'; pa.cd = 150; } }
      for (const co of L.coins) { const dx = cx - co.x, dy = p.y + p.h / 2 - co.y, d = Math.hypot(dx, dy); if (d < 130 && d > 1) { co.x += dx / d * 5; co.y += dy / d * 5; } }
    }
    if (L.robot) {   // Roboter R0-B1: schwebt neben dem Helden und schießt Laser
      const rb = L.robot; rb.t++;
      const hx = cx - p.facing * 48, hy = p.y - 6 + Math.sin(rb.t * 0.06) * 5;
      rb.x += (hx - rb.x) * 0.1; rb.y += (hy - rb.y) * 0.1; if (rb.shootT > 0) rb.shootT--; else rb.facing = p.facing;
      if (--rb.cd <= 0) {
        const tg = nearestFoe(rb.x, rb.y, 340, true);
        if (tg) { const tx = tg.x + tg.w / 2, ty = tg.y + tg.h / 2, d = Math.hypot(tx - rb.x, ty - rb.y) || 1;
          L.shots.push({ kind: 'laser', aim: true, x: rb.x, y: rb.y, vx: (tx - rb.x) / d * 11, vy: (ty - rb.y) / d * 11, life: 45, dmg: 1, color: L.era === 14 ? '#e8a0ff' : '#ff4d6d' });
          rb.facing = tx > rb.x ? 1 : -1; rb.shootT = 12; rb.cd = 70; SFX.shoot2(); } else rb.cd = 12;
      }
    }
    if (L.runaway) { const r = L.runaway; r.x += r.vx; r.t++; if (r.t > 90) L.runaway = null; }
  }
  // =====================================================================
  //  FALLEN: rollende Fässer, Steinschlag, Geysire, Laser – und Verfolgungsjagden
  // =====================================================================
  function updateHazards() {
    const p = P, box = { x: p.x, y: p.y, w: p.w, h: p.h };
    for (const sp of L.spawners) {
      if (Math.abs(sp.x - (cam + W / 2)) > W) continue;
      if (--sp.t <= 0) { sp.t = Math.round(210 / diffK); L.rollers.push({ x: sp.x - 15, y: sp.y + T - 30, w: 30, h: 30, vx: -2.6 * diffK, vy: 0, rot: 0, life: 420, onGround: false }); }
    }
    for (const r of L.rollers) {
      r.vy = Math.min(r.vy + L.grav, L.maxFall); moveX(r); if (r.hitWall) { r.life = 0; burst(r.x + 15, r.y + 15, '#c9b08a', 8); } moveY(r, false);
      r.rot += r.vx / 15; r.life--; if (r.y > H + 40) r.life = 0;
      if (r.life > 0 && !p.dead && overlap(box, r)) {
        if (p.vy > 0 && p.prevBottom <= r.y + 10) { p.vy = keys.jump ? -12 : -9; SFX.stomp(); }
        else hurt();
      }
    }
    L.rollers = L.rollers.filter((r) => r.life > 0);
    for (const d of L.droppers) {
      if (d.state === 'wait') { if (Math.abs(p.x + p.w / 2 - d.x) < 110 && Math.abs(d.x - p.x) < 300) { d.state = 'shake'; d.t = 34; } }
      else if (d.state === 'shake') { if (--d.t <= 0) { d.state = 'fall'; d.vy = 0; } }
      else if (d.state === 'fall') {
        d.vy = Math.min(d.vy + L.grav * 0.7, 12); d.y += d.vy;
        const hitGround = d.y > 0 && solid(tileAt(Math.floor(d.x / T), Math.floor((d.y + 14) / T)));
        if (hitGround || d.y > H) { d.state = 'cool'; d.t = 150; burst(d.x, d.y + 10, '#c9d1dc', 10); SFX.crumble(); }
        else if (!p.dead && overlap(box, { x: d.x - 12, y: d.y - 12, w: 24, h: 26 })) hurt();
      } else if (--d.t <= 0) { d.state = 'wait'; d.y = d.y0; }
    }
    for (const v of L.vents) {
      const ph = (frame + v.off) % 200;
      v.active = ph >= 150; v.warn = ph >= 115 && ph < 150;
      if (v.warn && frame % 5 === 0) L.particles.push({ x: v.x + rand(-8, 8), y: v.y - 4, vx: 0, vy: rand(-1.5, -0.6), life: 16, max: 16, size: 3, color: '#ffffff', g: 0 });
      if (v.active && !p.dead && overlap(box, { x: v.x - 13, y: v.y - 150, w: 26, h: 150 })) hurt();
    }
    for (const la of L.lasers) {
      const ph = (frame + la.off) % 170; la.on = ph < 70; la.warn = ph >= 150;
      if (la.on && !p.dead && overlap(box, { x: la.x - 5, y: la.top, w: 10, h: la.bottom - la.top })) hurt();
    }

    const ch = L.chaser;
    if (ch && !p.dead) {
      ch.t++;

        let v = 2.3 + (diffK - 1) * 0.7;
        if (p.x - ch.x > 700) v = 5.5;   // holt auf, wenn man weit vorn ist
        if (L.goal && ch.x > L.goal.x - 280) v = 0;
        ch.x += v;
        if (p.x - ch.x < 320 && frame % 8 === 0) shake = Math.max(shake, 2);
        if (ch.x > p.x + 6) {   // eingeholt!
          p.hearts--; shake = 12; SFX.hurt(); burst(p.x + p.w / 2, p.y + p.h / 2, '#ff4d6d', 14);
          if (p.hearts <= 0) die();

        }
      }
    }
  }

  function rescue() {

  function startAttack() {
    const p = P, w = WEAPONS[run.weapon];
    p.atk = w.swing; p.atkCd = w.cd;
    const up = keys.up && w.ranged;   // ↑ + Angriff: senkrecht nach oben schießen
    const down = keys.down && !p.onGround && !up;   // in der Luft ↓ + Angriff: nach unten
    p.atkDown = down;
    const sx = up ? p.x + p.w / 2 + p.facing * 4 : down ? p.x + p.w / 2 + p.facing * 3 : p.x + p.w / 2 + p.facing * 14,
          sy = up ? p.y - 6 : down ? p.y + p.h + 4 : p.y + (p.crouch ? 10 : 16);
    if (w.ranged) {
      const sh = w.shot, n = sh.spread ? 3 : 1;
      for (let k = 0; k < n; k++) {
        const a = sh.spread ? (k - 1) * 0.15 : 0;
        const dx = up || down ? Math.sin(a) : Math.cos(a) * p.facing, dy = up ? -Math.cos(a) : down ? Math.cos(a) : Math.sin(a);
        L.shots.push({ boomerang: !!sh.boomerang, bx: dx, by: dy, kind: sh.kind, x: sx, y: sy, vx: dx * sh.speed, vy: dy * sh.speed + (sh.lob && !up && !down ? -3.2 : 0), g: down ? 0 : sh.g || 0, life: sh.life, dmg: w.dmg,
                       up, down, pierce: !!sh.pierce, homing: !!sh.homing, color: w.color, rot: 0, hitList: [] });
      }
      if (w.gun) { L.particles.push({ x: sx + (up || down ? 0 : p.facing * 16), y: up ? sy - 14 : down ? sy + 12 : sy - 2, vx: 0, vy: 0, life: 5, max: 5, size: 9, color: '#ffe9a0', g: 0 }); }
      SFX[sh.sfx]();
    } else SFX.swing();
    if (w.fire && !down) { L.shots.push({ kind: 'flame', x: p.x + p.w / 2 + p.facing * 20, y: p.y + 20, vx: p.facing * 7, vy: 0, life: 30, dmg: 1, color: w.wave || '#ff7b2b', pierce: true }); SFX.fire(); }
  }
  function meleeHit() {
    const p = P, w = WEAPONS[run.weapon];
    const hb = p.atkDown ? { x: p.x - 10, y: p.y + p.h - 8, w: p.w + 20, h: Math.max(34, w.range * 0.7) }   // Stoß nach unten
             : w.thrust ? { x: p.facing > 0 ? p.x + p.w - 6 : p.x - w.range + 6, y: p.y + 2, w: w.range, h: 22 }   // Speer: lang, aber schmal
                        : { x: p.facing > 0 ? p.x + p.w - 6 : p.x - w.range + 6, y: p.y - 14, w: w.range, h: p.h + 20 };
